name: Daily Management Intelligence Briefing

on:
  schedule:
    # --------------------------------------------------------------------------
    # SCHEDULE CONFIGURATION:
    # 7:00 AM IST (India Standard Time = UTC+5:30) corresponds to 01:30 UTC.
    # Format: minute hour day-of-month month day-of-week (in UTC)
    #
    # Time Conversion Quick Reference (UTC -> IST):
    # - 01:30 UTC = 07:00 AM IST (Default)
    # - 00:30 UTC = 06:00 AM IST
    # - 02:30 UTC = 08:00 AM IST
    # --------------------------------------------------------------------------
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate briefing and save artifact without sending email'
        required: false
        default: false
        type: boolean
      recipient_override:
        description: 'Temporary recipient email override'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Management Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_TO: ${{ inputs.recipient_override || secrets.EMAIL_TO || 'tpss81200@gmail.com' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'Management Intelligence <onboarding@resend.dev>' }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          python main.py

      - name: Upload Briefing Artifact (Preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-html
          path: data/sample_briefing.html
          retention-days: 7

      - name: Commit Updated History
        if: success() && !(inputs.dry_run)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history/sent_stories.json
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update sent stories history [skip ci]"
            git push
          fi
